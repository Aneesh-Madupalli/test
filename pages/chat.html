<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat</title>
  <link rel="stylesheet" href="../assets/styles.css" />
  <script defer src="../assets/navbar.js"></script>
  <script defer src="chat.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e1e;
      color: #f1f1f1;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 90vh;
      margin: 20px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      border-radius: 12px;
      background-color: #2c2c2c;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      word-wrap: break-word;
      line-height: 1.4;
      font-size: 14px;
      position: relative;
    }

    .message.user {
      background-color: #0078d7;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      background-color: #3a3a3a;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .bot-label {
      font-size: 11px;
      color: #9e9e9e;
      position: absolute;
      top: -16px;
      left: 10px;
    }

    .typing {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 2px;
      background-color: #f1f1f1;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing:nth-child(2) { animation-delay: 0.2s; }
    .typing:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }

    .input-container {
      display: flex;
      margin-top: 12px;
    }

    #userInput {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      background-color: #2c2c2c;
      color: #f1f1f1;
    }

    #sendBtn {
      margin-left: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background-color: #0078d7;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    #providerSelect {
      margin-bottom: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      border: none;
      background-color: #2c2c2c;
      color: #f1f1f1;
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  <div class="chat-container">
    <select id="providerSelect">
      <option value="groq">Groq</option>
      <option value="openrouter">OpenRouter</option>
      <option value="openai">OpenAI</option>
      <option value="perplexity">Perplexity</option>
    </select>

    <div class="messages" id="messages"></div>

    <div class="input-container">
      <input type="text" id="userInput" placeholder="Type your message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</body>
</html>
